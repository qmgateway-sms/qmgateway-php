# The PHP SDK is released by pushing a SIGNED version tag. Packagist reads the tag from GitHub (it does not take uploads), so there is no
# token to protect here. This workflow is the gate: it only passes when the tag is signed, valid and matches composer.json, and the
# tests pass. Make it a required check for tags with a GitHub ruleset, and enable Packagist's GitHub hook so new tags appear at once.
#
# One-time setup, by a person with MFA:
#   1. Register the package on packagist.org with the GitHub repository, turn on MFA on the account, and use the GitHub integration (not a shared login).
#   2. In GitHub rulesets, protect tags "v*": block deletion and updates, so a published tag can never be moved or re-tagged.
# Actions are pinned to full commit hashes (the tag is in the comment); Dependabot proposes updates.
name: Release check (Packagist)
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Check the tag is signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag" ] || { echo "Use an annotated, signed tag (git tag -s). Refusing to publish."; exit 1; }
          sha=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}")
          ok=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/tags/${sha}" | jq -r '.verification.verified')
          [ "$ok" = "true" ] || { echo "GitHub does not show this tag as Verified. Refusing to publish."; exit 1; }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with: { php-version: '8.5', extensions: 'curl, json', coverage: none }
      - run: composer validate --strict
      - name: The changelog entry for this version is dated
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^## $v " CHANGELOG.md || { echo "CHANGELOG.md has no entry for $v."; exit 1; }
          if grep -q "^## $v (unreleased)" CHANGELOG.md; then echo "Replace '(unreleased)' with the release date (YYYY-MM-DD) in CHANGELOG.md."; exit 1; fi
      - run: git clone --depth 1 https://github.com/qmgateway-sms/qmgateway-contract.git tests/contract
      - run: php tests/run.php
